name: Publish Siltok company guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare and verify installers from release assets
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, shutil, tempfile, urllib.request
          root = Path('site')
          manifest = json.loads((root / 'downloads/manifest.json').read_text())
          with tempfile.TemporaryDirectory() as temporary:
              for name, entry in manifest.items():
                  installer = Path(temporary) / name
                  request = urllib.request.Request(entry['sourceUrl'], headers={'User-Agent': 'Siltok-guide-build'})
                  digest = hashlib.sha256()
                  size = 0
                  with urllib.request.urlopen(request, timeout=120) as response, installer.open('wb') as output:
                      while data := response.read(4 * 1024 * 1024):
                          output.write(data)
                          digest.update(data)
                          size += len(data)
                  assert size == entry['bytes'] and digest.hexdigest() == entry['sha256'], name + ': release asset mismatch'
                  assert len(entry['chunks']) == len(entry['chunkSha256'])
                  rebuilt = hashlib.sha256()
                  with installer.open('rb') as source:
                      for chunk, expected in zip(entry['chunks'], entry['chunkSha256']):
                          data = source.read(4 * 1024 * 1024)
                          assert data and hashlib.sha256(data).hexdigest() == expected, chunk
                          target = root / chunk
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(data)
                          rebuilt.update(data)
                      assert not source.read(1), name + ': unexpected trailing bytes'
                  assert rebuilt.hexdigest() == entry['sha256'], name + ': rebuilt installer mismatch'
                  print(name, 'verified:', size, 'bytes')
          for old in ['downloads/windows', 'downloads/macos']:
              shutil.rmtree(root / old, ignore_errors=True)
          (root / 'assets/wecom-linan.jpg').unlink(missing_ok=True)
          assert '李楠' not in (root / 'index.html').read_text()
          assert (root / 'assets/siltok-creator-community-qr.jpg').is_file()
          PYTHON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish company website
        id: deployment
        uses: actions/deploy-pages@v4
